# ~/.config/picom/picom.conf — tokyo-night flavored compositor
backend = "glx";
vsync = true;
use-damage = true;
detect-transient = true;
detect-client-leader = true;

# rounded corners
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'xmobar'",
    "class_g = 'trayer'",
];

# shadows on floats only
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.55;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#000000";
shadow-exclude = [
    "class_g = 'xmobar'",
    "class_g = 'trayer'",
    "class_g = 'kitty'",
    "class_g = 'Alacritty'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c",
];

# fade
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# blur behind
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = false;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'xmobar'",
    "class_g = 'trayer'",
    "_GTK_FRAME_EXTENTS@:c",
];

# per-window opacity
inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'Google-chrome'",
    "100:class_g = 'mpv'",
    "100:fullscreen",
    "92:class_g = 'kitty' && focused",
    "88:class_g = 'kitty' && !focused",
    "92:class_g = 'Alacritty' && focused",
    "88:class_g = 'Alacritty' && !focused",
];

# window-type rules
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.90; focus = true; full-shadow = false; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.94; };
    dropdown_menu = { opacity = 0.94; };
    notification = { shadow = true; corner-radius = 8; };
};

###############################################################################
# picom-pijulius-next animations
###############################################################################
animations = (
    { triggers = ["open", "show"];
      preset = "appear";
      duration = 0.15; },
    { triggers = ["close", "hide"];
      preset = "disappear";
      duration = 0.15; },
    { triggers = ["workspace-out"];
      preset = "slide-out";
      duration = 0.18; },
    { triggers = ["workspace-in"];
      preset = "slide-in";
      duration = 0.18; }
);
animation-clamping = true;

